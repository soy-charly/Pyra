<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Pyra</title>
  <desc id="desc">Logotipo de Pyra: una P geométrica violeta con llaves en el interior y el nombre Pyra debajo.</desc>
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.52" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- Emblema geométrico: una P construida como una cinta angular -->
  <path fill="url(#purple)" d="M270 145H635c139 0 224 79 224 203v110c0 127-85 207-224 207H430L270 825V466l143-164H270z"/>
  <path fill="#09090b" d="M410 302h224c65 0 103 35 103 96v112c0 62-38 97-103 97H456l-94 96V446z"/>
  <path fill="url(#fold)" d="M270 145h143L270 302z" opacity=".95"/>
  <path fill="#6d28d9" d="M270 466l143-164v301L270 746z" opacity=".9"/>

  <!-- Llaves -->
  <g fill="none" stroke="#f8fafc" stroke-width="25" stroke-linecap="square" stroke-linejoin="round">
    <path d="M492 370h-28c-13 0-21 9-21 23v34c0 18-10 29-28 34 18 5 28 16 28 34v34c0 14 8 23 21 23h28"/>
    <path d="M615 370h28c13 0 21 9 21 23v34c0 18 10 29 28 34-18 5-28 16-28 34v34c0 14-8 23-21 23h-28"/>
  </g>

  <!-- Nombre; texto editable y vectorizable en cualquier editor SVG -->
  <text x="512" y="950" text-anchor="middle" fill="#f8fafc"
        font-family="Inter, Montserrat, Arial, sans-serif" font-size="154"
        font-weight="650" letter-spacing="-8">Pyra</text>
</svg>
